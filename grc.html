<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GRC field guide · StudyCISSP</title>
  <meta name="theme-color" content="#1f5c43">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/grc/grc.css?v=dev">
  <script>
    // same theme as the rest of StudyCISSP, and follow changes made in the main window
    (function(){function apply(){try{var s=JSON.parse(localStorage.getItem('cissp.settings')||'{}');
      document.documentElement.dataset.theme=s.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'paper');}catch(e){}}
      apply();addEventListener('storage',function(e){if(e.key==='cissp.settings')apply();});})();
  </script>
</head>
<body style="margin:0">
  <div id="grc-guide"><div id="root"></div></div>
  <script src="assets/grc/grc.js?v=dev"></script>
</body>
</html>
