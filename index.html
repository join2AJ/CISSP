<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyCISSP</title>
  <meta name="description" content="StudyCISSP: a calm, book-like way to prepare for the CISSP. Clear chapters, animations for tricky ideas, a plan built around your exam date, quizzes, flashcards and mock exams.">
  <meta name="theme-color" content="#f7f3ea">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%231f5c43'/><path d='M32 11l17 7v13c0 10-7 18-17 22-10-4-17-12-17-22V18z' fill='none' stroke='white' stroke-width='4'/><path d='M24 32l6 6 11-12' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=dev">
  <script>
    (function(){try{var s=JSON.parse(localStorage.getItem('cissp.settings')||'{}');
      var t=s.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'paper');
      document.documentElement.dataset.theme=t;
      if(s.size)document.documentElement.style.setProperty('--fs',s.size+'px');
      if(s.face)document.documentElement.dataset.face=s.face;}catch(e){document.documentElement.dataset.theme='paper';}})();
  </script>
</head>
<body>
  <div class="read-progress" aria-hidden="true"><span id="readBar"></span></div>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="tocToggle" aria-label="Open contents">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2.5l7.5 3v6.2c0 4.6-3.2 8.3-7.5 9.8-4.3-1.5-7.5-5.2-7.5-9.8V5.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12l2.4 2.4 4.6-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-text"><b>Study<span>CISSP</span></b><small>read slowly · pass once</small></span>
    </a>
    <nav class="mainnav" aria-label="Study">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/read" data-nav="read">Chapters</a>
      <a href="#/quiz" data-nav="quiz">Quiz</a>
      <a href="#/flashcards" data-nav="flashcards">Flashcards</a>
      <a href="#/glossary" data-nav="glossary">Glossary</a>
      <a href="#/mock" data-nav="mock">Mock</a>
      <a href="#/plan" data-nav="plan">Plan</a>
      <a href="#/insights" data-nav="insights">Insights</a>
      <a href="#/admin" data-nav="admin" id="navAdmin" hidden>Admin</a>
    </nav>
    <nav class="pubnav" id="pubnav" aria-label="Site">
      <a href="#/landing" data-nav="landing">Home</a>
      <a href="#/features" data-nav="features">Features</a>
      <a href="#/pricing" data-nav="pricing">Pricing</a>
      <a href="#/about" data-nav="about">About CISSP</a>
      <a href="#/faq" data-nav="faq">FAQ</a>
      <a href="#/contact" data-nav="contact">Contact</a>
      <span class="pub-mobile-actions"><a href="#/login" class="btn small">Sign in</a><a href="#/signup/gold" class="btn small primary">Get started</a></span>
    </nav>
    <div class="top-actions">
      <button class="search-btn" id="searchOpen" aria-label="Search">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Search</span><kbd>/</kbd>
      </button>
      <button class="display-btn" id="settingsOpen" aria-label="Display settings" aria-expanded="false" title="Display settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="pub-actions" id="pubActions"><a href="#/login" class="btn small ghost" id="pubSignin">Sign in</a><a href="#/signup/gold" class="btn small primary" id="pubStart">Get started</a></span>
      <button class="icon-btn pub-menu-btn" id="pubMenuBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="user-btn" id="userBtn" aria-label="Account menu" hidden><span id="userIni">•</span></button>
    </div>
    <div class="user-menu" id="userMenu" hidden></div>
  </header>

  <div class="settings-pop" id="settings" hidden role="dialog" aria-label="Display settings">
    <div class="set-title">Display</div>
    <div class="set-block">
      <span class="set-label">Appearance</span>
      <div class="theme-pick" role="radiogroup" aria-label="Appearance">
        <button data-theme-set="paper" class="tp tp-light" role="radio"><i></i><span>Light</span></button>
        <button data-theme-set="sepia" class="tp tp-sepia" role="radio"><i></i><span>Sepia</span></button>
        <button data-theme-set="night" class="tp tp-night" role="radio"><i></i><span>Dark</span></button>
      </div>
    </div>
    <div class="set-block">
      <span class="set-label">Text size</span>
      <div class="size-pick">
        <button data-size="-1" aria-label="Smaller text"><small>A</small></button>
        <button data-size="0" aria-label="Default size">Default</button>
        <button data-size="1" aria-label="Larger text"><b>A</b></button>
      </div>
    </div>
    <div class="set-block">
      <span class="set-label">Reading font</span>
      <div class="face-pick">
        <button data-face="serif"><span style="font-family:var(--serif)">Book</span></button>
        <button data-face="sans"><span style="font-family:var(--sans)">Clean</span></button>
      </div>
    </div>
  </div>

  <div class="shell">
    <aside class="toc" id="toc" aria-label="Contents"></aside>
    <div class="scrim" id="scrim"></div>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search-input">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search topics: Kerberos, RPO, Biba, SOC 2…" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <ol class="search-results" id="searchResults"></ol>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Lets Netlify Forms detect the contact form at deploy time -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="name"><input name="email"><input name="topic"><textarea name="message"></textarea><input name="bot-field">
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="assets/js/config.js?v=dev"></script>
  <script src="assets/js/content-1.js?v=dev"></script>
  <script src="assets/js/content-2.js?v=dev"></script>
  <script src="assets/js/pages.js?v=dev"></script>
  <script src="assets/js/bank.js?v=dev"></script>
  <script src="assets/js/bank2.js?v=dev"></script>
  <script src="assets/js/glossary.js?v=dev"></script>
  <script src="assets/js/anims.js?v=dev"></script>
  <script src="assets/js/db.js?v=dev"></script>
  <script src="assets/js/app.js?v=dev"></script>
  <script src="assets/js/study.js?v=dev"></script>
  <script src="assets/js/account.js?v=dev"></script>
  <script src="assets/js/admin.js?v=dev"></script>
  <script src="assets/js/site.js?v=dev"></script>
</body>
</html>
