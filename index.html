<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The CISSP Reader</title>
  <meta name="description" content="A book-like CISSP study companion: eight domain chapters, a personal study plan, quizzes, flashcards, mock exams and progress insights.">
  <meta name="theme-color" content="#f7f3ea">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' rx='14' fill='%231f3b2d'/><path d='M22 33l7 7 14-16' stroke='%23e9dfc6' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=dev">
  <script>
    (function(){try{var s=JSON.parse(localStorage.getItem('cissp.settings')||'{}');
      var t=s.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'paper');
      document.documentElement.dataset.theme=t;
      if(s.size)document.documentElement.style.setProperty('--fs',s.size+'px');
      if(s.face)document.documentElement.dataset.face=s.face;}catch(e){document.documentElement.dataset.theme='paper';}})();
  </script>
</head>
<body>
  <div class="read-progress" aria-hidden="true"><span id="readBar"></span></div>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="tocToggle" aria-label="Open contents">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-text"><b>The CISSP Reader</b><small>read slowly · pass once</small></span>
    </a>
    <nav class="mainnav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/read" data-nav="read">Chapters</a>
      <a href="#/quiz" data-nav="quiz">Quiz</a>
      <a href="#/flashcards" data-nav="flashcards">Flashcards</a>
      <a href="#/glossary" data-nav="glossary">Glossary</a>
      <a href="#/mock" data-nav="mock">Mock</a>
      <a href="#/plan" data-nav="plan">Plan</a>
      <a href="#/insights" data-nav="insights">Insights</a>
      <a href="#/admin" data-nav="admin" id="navAdmin" hidden>Admin</a>
    </nav>
    <div class="top-actions">
      <button class="search-btn" id="searchOpen" aria-label="Search">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Search</span><kbd>/</kbd>
      </button>
      <button class="icon-btn" id="settingsOpen" aria-label="Reading settings" aria-expanded="false">
        <span class="aa">Aa</span>
      </button>
      <button class="user-btn" id="userBtn" aria-label="Account menu" hidden><span id="userIni">•</span></button>
    </div>
    <div class="user-menu" id="userMenu" hidden></div>
  </header>

  <div class="settings-pop" id="settings" hidden>
    <div class="set-row">
      <span class="set-label">Theme</span>
      <div class="seg" role="radiogroup" aria-label="Theme">
        <button data-theme-set="paper" class="sw sw-paper" aria-label="Paper"></button>
        <button data-theme-set="sepia" class="sw sw-sepia" aria-label="Sepia"></button>
        <button data-theme-set="night" class="sw sw-night" aria-label="Night"></button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">Text size</span>
      <div class="seg">
        <button data-size="-1" aria-label="Smaller">A−</button>
        <button data-size="0" aria-label="Reset">A</button>
        <button data-size="1" aria-label="Larger">A+</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">Typeface</span>
      <div class="seg">
        <button data-face="serif">Serif</button>
        <button data-face="sans">Sans</button>
      </div>
    </div>
  </div>

  <div class="shell">
    <aside class="toc" id="toc" aria-label="Contents"></aside>
    <div class="scrim" id="scrim"></div>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search the manual">
      <div class="search-input">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search topics: Kerberos, RPO, Biba, SOC 2…" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <ol class="search-results" id="searchResults"></ol>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="assets/js/config.js?v=dev"></script>
  <script src="assets/js/content-1.js?v=dev"></script>
  <script src="assets/js/content-2.js?v=dev"></script>
  <script src="assets/js/pages.js?v=dev"></script>
  <script src="assets/js/bank.js?v=dev"></script>
  <script src="assets/js/glossary.js?v=dev"></script>
  <script src="assets/js/anims.js?v=dev"></script>
  <script src="assets/js/db.js?v=dev"></script>
  <script src="assets/js/app.js?v=dev"></script>
  <script src="assets/js/study.js?v=dev"></script>
  <script src="assets/js/account.js?v=dev"></script>
  <script src="assets/js/admin.js?v=dev"></script>
</body>
</html>
